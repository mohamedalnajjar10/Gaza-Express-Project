services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_NAME:-wasla}
      MYSQL_USER: gaza
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Set DOCKER_DB_ROOT_PASSWORD in .env}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u gaza -D ${DOCKER_DB_NAME:-wasla} -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
    restart: unless-stopped
  catalog-cache:
    image: redis:7.4-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: migrator
    command: [npx, prisma, migrate, deploy]
    environment:
      DATABASE_URL: mysql://gaza:${DOCKER_DB_PASSWORD}@mysql:3306/${DOCKER_DB_NAME:-wasla}
    depends_on:
      mysql: {condition: service_healthy}
  api:
    scale: ${API_REPLICAS:-2}
    build: .
    env_file: .env
    environment:
      PORT: 5050
      TRUST_PROXY: "1"
      CATALOG_CACHE_URL: redis://catalog-cache:6379
      REDIS_URL: redis://redis:6379
      DATABASE_URL: mysql://gaza:${DOCKER_DB_PASSWORD}@mysql:3306/${DOCKER_DB_NAME:-wasla}?connection_limit=10&pool_timeout=10
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5050/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  sms-worker:
    scale: ${SMS_WORKER_REPLICAS:-1}
    build: .
    profiles: [sms]
    command: [node, dist/src/sms/main.js]
    env_file: .env
    environment:
      DATABASE_URL: mysql://gaza:${DOCKER_DB_PASSWORD}@mysql:3306/${DOCKER_DB_NAME:-wasla}?connection_limit=5&pool_timeout=10
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:${GATEWAY_PORT:-5050}:80']
    volumes: ['./infra/nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  k6:
    image: grafana/k6:1.0.0
    profiles: [load]
    volumes: ['./test/load:/scripts:ro']
    command: [run, /scripts/catalog.js]
volumes:
  mysql-data:
  redis-data:
