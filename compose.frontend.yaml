services:
  gateway:
    image: ${WASLA_WEB_IMAGE:-wasla-web:local}
    build:
      context: ./apps/web
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_SMS_PROVIDER: ${SMS_PROVIDER:-disabled}
        VITE_GOOGLE_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
        VITE_BANK_TRANSFER_ENABLED: ${WEB_BANK_TRANSFER_ENABLED:-true}
    volumes:
      - ./apps/web/nginx.conf:/etc/nginx/nginx.conf:ro
