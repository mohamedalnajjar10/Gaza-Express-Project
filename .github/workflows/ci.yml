name: Application verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CROSS_BROWSER: '1'
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wasla_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      E2E_ALLOW_DATABASE: '1'
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/wasla_test
      REDIS_URL: redis://127.0.0.1:6379/1
      GOOGLE_CLIENT_ID: ci-client
      GOOGLE_CLIENT_SECRET: ci-secret
      GOOGLE_CALLBACK_URL: http://localhost:5051/api/v1/auth/google/callback
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npx prisma migrate deploy
      - name: Run integration tests
        run: |
          export JWT_SECRET="$(openssl rand -hex 64)"
          export JWT_REFRESH_SECRET="$(openssl rand -hex 64)"
          npm run test:e2e -- --runInBand
      - run: npm run test:redis
      - run: npm audit --omit=dev --audit-level=high
      - name: Install the browser for Compose smoke tests
        run: |
          npm ci --prefix apps/web
          npm --prefix apps/web exec -- playwright install --with-deps chromium
        working-directory: .
      - name: Verify migrations, media and the real browser journey through Docker
        run: bash infra/compose-smoke.sh
        working-directory: .
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API and Web production images
        run: |
          docker build -t wasla-api:ci ./apps/api
          docker build -t wasla-web:ci ./apps/web
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Scan container images for fixable HIGH/CRITICAL CVEs
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 wasla-api:ci
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 wasla-web:ci
