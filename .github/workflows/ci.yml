name: Backend verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wasla_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/wasla_test
      REDIS_URL: redis://127.0.0.1:6379/1
      GOOGLE_CLIENT_ID: ci-client
      GOOGLE_CLIENT_SECRET: ci-secret
      GOOGLE_CALLBACK_URL: http://localhost:5051/api/v1/auth/google/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npx prisma migrate deploy
      - name: Run integration tests
        run: |
          export JWT_SECRET="$(openssl rand -hex 64)"
          export JWT_REFRESH_SECRET="$(openssl rand -hex 64)"
          npm run test:e2e -- --runInBand
      - name: Build the deployable Docker image
        run: |
          docker build --tag wasla-backend:ci .
          docker build --target migrator --tag wasla-migrator:ci .
