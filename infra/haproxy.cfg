global
  maxconn 4096

defaults
  mode http
  timeout connect 3s
  timeout client 35s
  timeout server 32s
  timeout check 2s
  retries 0

resolvers docker
  nameserver docker 127.0.0.11:53
  accepted_payload_size 8192
  hold valid 5s

frontend api
  bind :8080
  default_backend api_replicas

backend api_replicas
  balance leastconn
  option httpchk
  http-check send meth GET uri /api/v1/routing-ready
  http-check expect status 200
  server-template api 1-16 api:5050 check inter 3s fall 2 rise 2 resolvers docker init-addr none
