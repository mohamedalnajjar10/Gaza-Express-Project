events { worker_connections 4096; }
http {
  log_format upstream_timing 'request_id=$request_id $request_method $uri $status upstream=$upstream_addr seconds=$request_time';
  access_log /var/log/nginx/access.log upstream_timing;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Preserve real client IP when behind trusted Docker/RFC1918 TLS reverse proxies.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  upstream backend {
    zone backend 64k;
    server api-router:8080 resolve;
    keepalive 32;
  }
  server {
    listen 80;
    client_max_body_size 6m;

    # Match 120s server SSE lease with margin so live order updates are not cut at 30s.
    location ~ ^/api/[^/]+/orders/updates$ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 150s;
    }

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}
