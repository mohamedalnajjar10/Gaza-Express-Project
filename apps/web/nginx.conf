events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format upstream_timing 'request_id=$request_id $request_method $uri $status upstream=$upstream_addr seconds=$request_time';
  access_log /var/log/nginx/access.log upstream_timing;
  resolver 127.0.0.11 valid=10s ipv6=off;
  sendfile on;
  gzip on;
  gzip_types application/javascript application/json text/css;

  # Preserve real client IP when behind trusted Docker/RFC1918 TLS reverse proxies.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  map $uri $asset_cache {
    ~^/api/ "";
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
  }
  # style-src keeps 'unsafe-inline' because Google Maps JS API and React inline style props
  # inject runtime styles that cannot use static hashes on a static SPA; script-src remains strict.
  map $uri $page_policy {
    ~^/api/ "";
    default "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://maps.gstatic.com https://*.google.com data: blob:; frame-src https://*.google.com; worker-src blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
  }
  upstream backend {
    zone backend 64k;
    server api-router:8080 resolve;
    keepalive 32;
  }
  server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $page_policy always;
    add_header Cache-Control $asset_cache;

    # Match 120s server SSE lease with margin so live order updates are not cut at 30s.
    location ~ ^/api/[^/]+/orders/updates$ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 150s;
    }

    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
  }
}
