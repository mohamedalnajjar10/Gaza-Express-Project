events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format upstream_timing '$request_method $uri $status upstream=$upstream_addr seconds=$request_time';
  access_log /var/log/nginx/access.log upstream_timing;
  resolver 127.0.0.11 valid=10s ipv6=off;
  sendfile on;
  gzip on;
  gzip_types application/javascript application/json text/css;
  map $uri $asset_cache {
    ~^/api/ "";
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
  }
  map $uri $page_policy {
    ~^/api/ "";
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
  }
  upstream backend {
    zone backend 64k;
    least_conn;
    server api:5050 resolve;
    keepalive 32;
  }
  server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $page_policy always;
    add_header Cache-Control $asset_cache;
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
  }
}
